name: Java CI with Gradle

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set up JDK 26
      uses: actions/setup-java@v6
      with:
        java-version: '26'
        distribution: 'zulu'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Execute Gradle build
      run: ./gradlew build

    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: build-jars
        path: build/libs/MinecraftBingo-*.jar
